<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Admin Dashboard</title>
    <style>
        :root {
            --primary: #8ba0ce;
            --primary-hover: #4f70b8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --bg: #f1f2f4;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h2 { text-align: center; color: var(--primary); margin-bottom: 2rem; }
        h3 { font-size: 1.1rem; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        input {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        button {
            cursor: pointer;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
        }

        #loginBtn { background: var(--primary); color: white; width: 100%; margin-bottom: 20px; }
        #addEntryBtn, #addColorBtn { background: var(--primary); color: white; }
        #addEntryBtn:hover, #addColorBtn:hover { background: var(--primary-hover); }

        .btn-danger { background: #fee2e2; color: var(--danger); border: 2px solid #fecaca !important; }
        .btn-danger:hover { background: var(--danger); color: white; }

        .flex-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        small { color: #64748b; display: block; margin-bottom: 12px; }

        /* Mobile specific tweaks */
        @media (max-width: 480px) {
            body { padding: 10px; }
            .flex-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Admin Dashboard</h2>
    
    <button id="loginBtn">Login with Google</button>

    <div id="adminPanel" style="display:none;">
        
        <div class="card">
            <h3>Add / Update Entry</h3>
            <div class="input-group">
                <input id="makeInput" list="makeList" placeholder="Make" autocomplete="off" />
                <input id="modelInput" list="modelList" placeholder="Model" autocomplete="off" />
                <input id="categoryInput" list="categoryList" placeholder="Category" autocomplete="off" />
                <button id="addEntryBtn">Save Entry</button>
            </div>
        </div>

        <div class="card">
            <h3>Remove Entry</h3>
            <small>Tip: Leave fields blank to delete entire Makes or Models.</small>
            <div class="input-group">
                <input id="removeMakeInput" list="makeList" placeholder="Make to remove" autocomplete="off" />
                <input id="removeModelInput" list="modelList" placeholder="Model to remove" autocomplete="off" />
                <input id="removeCategoryInput" list="removeCategoryList" placeholder="Category to remove" autocomplete="off" />
                <button id="removeEntryBtn" class="btn-danger">Delete Selection</button>
            </div>
        </div>

        <div class="card">
            <h3>Manage Colours</h3>
            <div class="input-group">
                <input id="colorInput" list="colorList" placeholder="Colour name" autocomplete="off" />
                <div class="flex-row">
                    <button id="addColorBtn">Add</button>
                    <button id="removeColorBtn" class="btn-danger">Remove</button>
                </div>
            </div>
        </div>

    </div>
</div>

<datalist id="makeList"></datalist>
<datalist id="modelList"></datalist>
<datalist id="categoryList"></datalist>
<datalist id="colorList"></datalist>
<datalist id="categoryList"></datalist> <datalist id="removeCategoryList"></datalist>

<script type="module" src="./admin.js"></script>
</body>
</html>
