<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keytag generator</title>
    <style>
        .button-link {
            display: inline-block;
            padding: 10px 16px;
            background-color: #2563eb;
            color: white;
            text-decoration: none; /* removes underline */
            border-radius: 8px;
            font-weight: 600;
            text-align: center;

            .button-link:hover {

            }

            transform: scale(0.98);
            }
    </style>
</head>
